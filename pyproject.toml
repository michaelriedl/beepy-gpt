[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beepy-gpt"
dynamic = ["version"]
description = "Catch up on and steer Claude Code sessions from a Beepy handheld"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
bgpt = "beepy_gpt.client.cli:main"
bgpt-host = "beepy_gpt.host.cli:main"

[tool.setuptools.dynamic]
version = { attr = "beepy_gpt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Pin the rule set: newer ruff releases enable far more rules by default.
select = ["E4", "E7", "E9", "F"]
