# beepy-gpt client config. Copy to ~/.config/beepy-gpt/client.ini and edit.

[host]
# SSH destination of the workstation running Claude Code (anything `ssh` accepts).
ssh_target = user@workstation
# Extra ssh arguments, space separated (optional).
ssh_options =
# Command to run on the workstation.
host_command = bgpt-host
# Short label shown in the status bar.
label = workstation

[ui]
# lite = curses UI that runs on a Pi Zero W.
tier = lite
# true = use only ASCII characters (no box drawing / signal bars).
ascii = false

[device]
# Beepy firmware sysfs directory (battery, LED). Ignored if missing.
sysfs_root = /sys/firmware/beepy
led_alerts = true
# Smoothed voltage rise (millivolts over ~3 minutes) shown as "charging".
charge_rise_mv = 15

[wifi]
interface = wlan0

[security]
# Optional PIN required before approving tool use. Empty = disabled.
pin =
pin_idle_minutes = 10
