# beepy-gpt host config. Copy to ~/.config/beepy-gpt/host.ini (optional).

[hook]
# How long a permission request waits for a decision from the Beepy.
timeout_seconds = 600

[poll]
# How often the host re-reads `claude agents --json` while a client is connected.
agents_seconds = 3

[state]
# Where approvals and the audit log live. Empty = $XDG_STATE_HOME/beepy-gpt
dir =
